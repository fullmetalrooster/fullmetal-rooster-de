<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root{--bg:#05060a;--neon-pink:#ff34c8;--neon-cyan:#00e6ff}
      html,body{height:100%;}
      body{font-family:Orbitron,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;background:
        radial-gradient(600px 300px at 10% 10%, rgba(0,230,255,0.06) 0%, transparent 18%),
        radial-gradient(500px 250px at 90% 85%, rgba(255,52,200,0.05) 0%, transparent 14%),
        var(--bg);color:#e6f7ff;overflow-x:hidden}
      main{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;z-index:1;padding:2rem}
      h1{font-size:clamp(2rem,8vw,5rem);color:var(--neon-pink);text-shadow:0 0 10px var(--neon-pink),0 0 30px var(--neon-cyan);letter-spacing:0.06em;margin:0}
      .cyber-frame{background:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));padding:2rem;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04)}
      .bg-grid{position:fixed;inset:0;pointer-events:none;background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 40px);mix-blend-mode:overlay;opacity:0.06;z-index:-1}
      .perspective-grid{position:fixed;left:0;right:0;bottom:-30vh;height:140vh;pointer-events:none;z-index:0;opacity:0.12;mix-blend-mode:overlay;transform:perspective(800px) rotateX(70deg) translateZ(0);background-image:repeating-linear-gradient(0deg, rgba(0,230,255,0.08) 0 1px, transparent 1px 40px),repeating-linear-gradient(90deg, rgba(255,52,200,0.06) 0 1px, transparent 1px 40px);background-size:40px 40px,40px 40px;background-position:center bottom}
      .scanlines{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.04));background-size:100% 3px;opacity:0.06;z-index:0}
      .title-slash{color:#ffffff;text-align:center;font-size:clamp(1.5rem,4vw,2.5rem);margin-top:0.6rem;opacity:1}
      /* small screens */
      @media (max-width:600px){h1{text-shadow:0 0 8px var(--neon-pink);font-size:2rem}.cyber-frame{padding:1rem}}
    </style>
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="perspective-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <main>
      <div class="cyber-frame">
        {{ content }}
      </div>
    </main>
  </body>
</html>
